[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "toolbelt"
version = "0.1.0"
description = "Safe, typed tools for AI agents that work with files and media."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7,<3",
]

[dependency-groups]
dev = [
  "mypy>=1.10",
  "pytest>=8",
  "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/toolbelt"]
